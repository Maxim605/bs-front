services:
  arangodb:
    image: arangodb:latest
    container_name: bs-arangodb
    environment:
      ARANGO_ROOT_PASSWORD: test
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
    networks:
      - bs-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8529/_api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bs-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bs-front
    environment:
      ARANGO_URL: http://arangodb:8529
      ARANGO_DATABASE: big-sister-parser
      ARANGO_USERNAME: root
      ARANGO_PASSWORD: test
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      arangodb:
        condition: service_healthy
    networks:
      - bs-network
    restart: unless-stopped

volumes:
  arangodb_data:

networks:
  bs-network:
    driver: bridge
